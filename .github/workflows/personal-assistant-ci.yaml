name: CI-PersonalAssisntant

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  release:
    types: [published]

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/dotnet/personal-assistant-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PersonalAssistantApi.slnx

      - name: Build
        run: dotnet build PersonalAssistantApi.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PersonalAssistantApi.slnx --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/angular/personal-assistant-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/angular/personal-assistant-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadless

  docker:
    needs: [backend, frontend]
    if: github.event_name == 'release'

    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ steps.image-tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: image-tag
        run: echo "value=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: backend/dotnet/personal-assistant-api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/personal-assistant-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/personal-assistant-api:${{ steps.image-tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend/angular/personal-assistant-web
          build-args: |
            BUILD_CONFIG=azure
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/personal-assistant-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/personal-assistant-web:${{ steps.image-tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    if: github.event_name == 'release'

    runs-on: ubuntu-latest

    env:
      RESOURCE_GROUP: budget-app
      API_APP_NAME: budget-api
      FRONTEND_APP_NAME: budget-frontend
      API_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/personal-assistant-api:${{ needs.docker.outputs.image-tag }}
      FRONTEND_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/personal-assistant-web:${{ needs.docker.outputs.image-tag }}

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install containerapp CLI extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Set Docker Hub registry credential on both Container Apps
        run: |
          az containerapp registry set --name "$API_APP_NAME" --resource-group "$RESOURCE_GROUP" --server docker.io --username "${{ secrets.DOCKERHUB_USERNAME }}" --password "${{ secrets.DOCKERHUB_TOKEN }}"
          az containerapp registry set --name "$FRONTEND_APP_NAME" --resource-group "$RESOURCE_GROUP" --server docker.io --username "${{ secrets.DOCKERHUB_USERNAME }}" --password "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Update API Container App
        run: az containerapp update --name "$API_APP_NAME" --resource-group "$RESOURCE_GROUP" --image "$API_IMAGE"

      - name: Update frontend Container App
        run: |
          API_FQDN=$(az containerapp show --name "$API_APP_NAME" --resource-group "$RESOURCE_GROUP" --query "properties.configuration.ingress.fqdn" -o tsv)
          az containerapp update --name "$FRONTEND_APP_NAME" --resource-group "$RESOURCE_GROUP" --image "$FRONTEND_IMAGE" --set-env-vars "API_UPSTREAM=https://$API_FQDN"