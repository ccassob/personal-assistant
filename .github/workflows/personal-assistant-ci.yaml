name: CI-PersonalAssisntant

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/dotnet/personal-assistant-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PersonalAssistantApi.slnx

      - name: Build
        run: dotnet build PersonalAssistantApi.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PersonalAssistantApi.slnx --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/angular/personal-assistant-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/angular/personal-assistant-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadless

  docker:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: backend/dotnet/personal-assistant-api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/personal-assistant-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/personal-assistant-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend/angular/personal-assistant-web
          build-args: |
            BUILD_CONFIG=azure
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/personal-assistant-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/personal-assistant-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max